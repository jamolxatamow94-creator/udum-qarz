<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDUM QARZ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f0f7f7;
  font-family:Arial,sans-serif;
  color:#183638;
}
header{
  background:#087f8c;
  color:white;
  padding:22px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
main{
  max-width:420px;
  margin:45px auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 5px 25px #00000012;
}
h2{text-align:center}
input,button{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:10px;
  font-size:16px;
}
input{border:1px solid #ccd8d8}
button{
  background:#087f8c;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5}
#message{
  color:#b42318;
  text-align:center;
  overflow-wrap:anywhere;
}
#dashboard{display:none}
footer{
  text-align:center;
  color:#718586;
  margin-top:25px;
  font-size:13px;
}
</style>
</head>
<body>

<header>UDUM QARZ</header>

<main>
<section class="card" id="login">
<h2>Tizimga kirish</h2>
<form id="loginForm">
<label>Elektron pochta</label>
<input id="email" type="email"
placeholder="Email" required>
<label>Parol</label>
<input id="password" type="password"
placeholder="Parol" required>
<button id="loginButton" type="submit">
Kirish
</button>
</form>
<p id="message"></p>
</section>

<section class="card" id="dashboard">
<h2 id="welcome"></h2>
<p>Tizimga muvaffaqiyatli kirdingiz.</p>
<p>Huquq: Administrator</p>
<button id="logout">Chiqish</button>
</section>

<footer>UDUM QARZ • 2026</footer>
</main>

<script>
const db = supabase.createClient(
  "https://xcbbmbwgrwkzbcoijnbc.supabase.co",
  "sb_publishable_DfgQZv2a5IyqLAgmfwiN2w_PSbZc3og"
);

const el = id => document.getElementById(id);

async function checkUser(user){
  const {data,error} = await db
    .from("profiles")
    .select("full_name,role,active")
    .eq("id",user.id)
    .single();

  if(error || !data ||
     !data.active || data.role !== "admin"){
    await db.auth.signOut();
    el("message").textContent =
      "Kirish huquqi mavjud emas.";
    return;
  }

  el("welcome").textContent =
    "Xush kelibsiz, " + data.full_name;

  el("login").style.display = "none";
  el("dashboard").style.display = "block";
}

el("loginForm").onsubmit = async e => {
  e.preventDefault();
  el("loginButton").disabled = true;
  el("message").textContent = "";

  try{
    const {data,error} =
      await db.auth.signInWithPassword({
        email:el("email").value.trim(),
        password:el("password").value
      });

    if(error) throw error;

    el("password").value = "";
    await checkUser(data.user);

  }catch(error){
    el("message").textContent =
      "Kirishda xatolik: " + error.message;
  }finally{
    el("loginButton").disabled = false;
  }
};

el("logout").onclick = async () => {
  const {error} = await db.auth.signOut();
  if(!error) location.reload();
};

async function init(){
  const {data,error} = await db.auth.getUser();
  if(!error && data.user){
    await checkUser(data.user);
  }
}
init();
</script>

</body>
</html>
