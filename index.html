<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDUM QARZ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
.reportWide{max-width:950px}.reportScroll{overflow-x:auto}.reportTable{border-collapse:collapse;width:100%;font-size:13px}.reportTable td,.reportTable th{padding:9px;border-bottom:1px solid #ccd8d8;text-align:left;white-space:nowrap}.reportTable th{background:#e1eeee}
*{box-sizing:border-box}
body{margin:0;background:#eff7f7;color:#183638;font-family:Arial,sans-serif}
header{background:#087f8c;color:white;padding:20px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:23px}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 12px #0000000b}
.login{max-width:420px;margin:45px auto}
h2,h3{margin-top:0}
input,select,textarea,button{font:inherit;padding:13px;border-radius:9px;margin:5px 0}
input,select,textarea{width:100%;border:1px solid #ccd8d8;background:white}
button{background:#087f8c;color:white;border:0;cursor:pointer}
button:disabled{opacity:.5}
.full{width:100%}
.small{padding:8px 12px;font-size:13px}
.secondary{background:#e1eeee;color:#087f8c}
.green{background:#198754}
.red{color:#c0392b}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:white;border-radius:13px;padding:15px}
.stat small{color:#687e80}
.stat strong{display:block;margin-top:10px;font-size:20px;overflow-wrap:anywhere}
.total{background:#087f8c;color:white}
.total small{color:#d9ffff}
.actions{margin:15px 0}
.customer{border-bottom:1px solid #e4eeee;padding:14px 0;cursor:pointer}
.customer b{display:block}
.customer small{color:#718586}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.money{font-weight:bold;color:#b42318}
.muted{color:#718586;font-size:13px}
[hidden]{display:none!important}
dialog{width:94%;max-width:500px;border:0;border-radius:16px;padding:20px;color:#183638;max-height:90vh;overflow:auto}
dialog::backdrop{background:#0007}
#message{white-space:pre-wrap;overflow-wrap:anywhere}
footer{text-align:center;color:#718586;padding:20px;font-size:13px}
.auditDetail{background:#f3f8f8;border-radius:10px;padding:12px;margin-top:8px;cursor:default}.auditDetail summary{cursor:pointer;font-weight:bold;color:#087f8c}.auditSection{margin-top:12px}.auditSection h4{margin:0 0 6px;color:#345b91}.auditField{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,1.5fr);gap:8px;padding:6px 0;border-bottom:1px solid #dce8e8;font-size:13px}.auditField span:last-child{white-space:pre-wrap;overflow-wrap:anywhere;text-align:right;font-weight:600}
</style>
</head>
<body>
<header>
<b>UDUM QARZ</b>
<button id="logout" class="small secondary" hidden>Chiqish</button>
</header>
<main>
<section id="login" class="card login">
<h2>Tizimga kirish</h2>
<form id="loginForm">
<label>Elektron pochta</label>
<input id="email" type="email" required>
<label>Parol</label>
<input id="password" type="password" required>
<button class="full">Kirish</button>
</form>
</section>
<p id="message" role="status"></p>
<section id="dashboard" hidden>
<div class="line">
<h3 id="welcome"></h3>
<button id="refresh" class="small secondary">Yangilash</button>
</div>
<div class="grid">
<div class="stat total">
<small>Qarz qoldig'i</small>
<strong id="balance">—</strong>
</div>
<div class="stat">
<small>Mijozlar soni</small>
<strong id="count">—</strong>
</div>
<div class="stat">
<small>Jami qarz</small>
<strong id="debt">—</strong>
</div>
<div class="stat">
<small>Jami to'langan</small>
<strong id="paid">—</strong>
</div>
</div>
<div class="grid actions">
<button id="newCustomer">+ Yangi mijoz</button>
<button id="showReports" class="green">Hisobotlar</button>
<button id="showBranches" class="secondary">Do'konlar</button>
<button id="showEmployees" class="secondary" hidden>Xodimlar</button>
<button id="showAudit" style="background:#345b91">Amallar tarixi</button>
</div>
<div class="card">
<div class="line"><h3>Mijozlar</h3><button id="archiveList" class="small secondary">Arxiv (0)</button></div>
<input id="search" placeholder="Ism yoki telefon raqami">
<div id="customers"></div>
</div>
</section>
</main>
<dialog id="modal">
<div class="line">
<h3 id="modalTitle"></h3>
<button id="closeModal" class="small secondary">Yopish</button>
</div>
<div id="modalBody"></div>
<p id="modalMessage" class="red"></p>
</dialog>
<footer>UDUM QARZ • 2026</footer>
<script>
const db=supabase.createClient(
"https://xcbbmbwgrwkzbcoijnbc.supabase.co",
"sb_publishable_DfgQZv2a5IyqLAgmfwiN2w_PSbZc3og"
);
const el=id=>document.getElementById(id);
let customers=[],branches=[],archivedCustomers=[];
let archiveMode=false;
let profile=null;
const admin=()=>profile?.role==="admin";
const money=n=>Number(n||0).toLocaleString("ru-RU")+" so'm";

function node(tag,text,cls){
 const n=document.createElement(tag);
 n.textContent=text;
 if(cls)n.className=cls;
 return n;
}
function button(text,fn,cls){
 const b=node("button",text,cls);
 b.type="button";
 b.onclick=fn;
 return b;
}
function modal(title){
 el("modal").classList.remove("reportWide");
 el("modalTitle").textContent=title;
 el("modalBody").replaceChildren();
 el("modalMessage").textContent="";
 if(!el("modal").open)el("modal").showModal();
 return el("modalBody");
}
function errorMessage(e){
 el("message").textContent=e.message||String(e);
}
async function rpc(name,args){
 const {data,error}=await db.rpc(name,args);
 if(error)throw error;
 return data;
}
async function read(table,columns){
 let result=[];
 for(let start=0;;start+=500){
 const {data,error}=await db.from(table)
 .select(columns).order(columns.split(",")[0])
 .range(start,start+499);
 if(error)throw error;
 result.push(...data);
 if(data.length<500)return result;
 }
}
async function checkUser(user){
 const {data,error}=await db.from("profiles")
 .select("full_name,role,active,branch_id")
 .eq("id",user.id).single();
 if(error||!data||!data.active||!["admin","employee"].includes(data.role)){
 await db.auth.signOut();
 throw new Error("Kirish huquqi mavjud emas.");
 }
 profile={...data,id:user.id};
 if(!admin()){
 const {data:b,error:be}=await db.from("branches").select("name,active").eq("id",profile.branch_id).single();
 if(be||!b?.active){await db.auth.signOut();throw Error("Faol do'kon biriktirilmagan.");}
 profile.branchName=b.name;
 }
 el("welcome").textContent=data.full_name+(admin()?" · Admin":" · "+profile.branchName);
 for(const id of ["showBranches","archiveList","showEmployees"])el(id).hidden=!admin();
 el("showReports").textContent="Hisobotlar";
 el("showAudit").style.gridColumn=admin()?"":"1 / -1";
 el("showReports").onclick=admin()?reportMenu:dailyReport;
 el("balance").parentElement.parentElement.hidden=false;
 el("login").hidden=true;
 el("dashboard").hidden=false;
 el("logout").hidden=false;
 await load();
}
el("loginForm").onsubmit=async e=>{
 e.preventDefault();
 const b=e.target.querySelector("button");
 b.disabled=true;
 el("message").textContent="";
 try{
 const {data,error}=await db.auth.signInWithPassword({
 email:el("email").value.trim(),
 password:el("password").value
 });
 if(error)throw error;
 el("password").value="";
 await checkUser(data.user);
 }catch(e){errorMessage(e)}
 finally{b.disabled=false}
};
el("logout").onclick=async()=>{
 const {error}=await db.auth.signOut();
 if(error)errorMessage(error);
 else location.reload();
};
async function load(){
 el("message").textContent="";
 try{
 const [c,b]=await Promise.all([
 read("customer_balances","customer_id,full_name,phone,archived,total_debt,total_paid,balance"),
 read("branches","id,name,active")
 ]);
 customers=c.filter(x=>!x.archived);
 archivedCustomers=c.filter(x=>x.archived);
 el("archiveList").textContent=archiveMode?"Faol mijozlar":`Arxiv (${archivedCustomers.length})`;
 branches=b.filter(x=>x.active);
 for(const [id,key] of [
 ["balance","balance"],
 ["debt","total_debt"],
 ["paid","total_paid"]
 ]){
 el(id).textContent=money(customers.reduce(
 (s,x)=>s+Number(x[key]||0),0));
 }
 el("count").textContent=customers.length;
 renderCustomers();
 }catch(e){errorMessage(e)}
}
function renderCustomers(){
 const q=el("search").value.trim().toLowerCase();
 const box=el("customers");
 box.replaceChildren();
 const list=(archiveMode?archivedCustomers:customers).filter(c=>
 (c.full_name+" "+(c.phone||"")).toLowerCase().includes(q)
 );
 if(!list.length)box.append(node("p","Mijozlar topilmadi.","muted"));
 for(const c of list){
 const row=node("div","","customer line");
 const info=node("div","");
 info.append(node("b",c.full_name),
 node("small",c.phone||"Telefon kiritilmagan"));
 row.append(info,node("span",money(c.balance),"money"));
 row.onclick=()=>showCustomer(c.customer_id);
 box.append(row);
 }
}
el("archiveList").onclick=()=>{archiveMode=!archiveMode;el("archiveList").textContent=archiveMode?"Faol mijozlar":`Arxiv (${archivedCustomers.length})`;renderCustomers();};
el("search").oninput=renderCustomers;
el("refresh").onclick=load;
el("closeModal").onclick=()=>el("modal").close();
el("showBranches").onclick=()=>{
 const box=modal("Do'konlar");
 for(const b of branches)box.append(node("p",b.name));
 if(!branches.length)box.append(node("p","Faol do'kon topilmadi."));
};
el("newCustomer").onclick=()=>{
 const box=modal("Yangi mijoz");
 box.innerHTML=`
 <form id="customerForm">
 <label>Ism familiya</label>
 <input name="name" required>
 <label>Telefon raqami</label>
 <input name="phone" type="tel">
 <label>Izoh</label>
 <textarea name="note"></textarea>
 <button class="full">Saqlash</button>
 </form>`;
 el("customerForm").onsubmit=async e=>{
 e.preventDefault();
 const f=new FormData(e.target);
 const b=e.target.querySelector("button");
 b.disabled=true;
 try{
 if(!f.get("name").trim())throw new Error("Ism kiriting.");
 await rpc("add_customer",{
 p_full_name:f.get("name").trim(),
 p_phone:f.get("phone").trim()||null,
 p_note:f.get("note").trim()||null
 });
 el("modal").close();
 await load();
 }catch(e){el("modalMessage").textContent=e.message}
 finally{b.disabled=false}
 };
};
async function showCustomer(id){
 const c=[...customers,...archivedCustomers].find(x=>x.customer_id===id);
 if(!c)return;
 const box=modal(c.full_name);
 box.append(node("p",c.phone||"Telefon yo'q"),
 node("h2",money(c.balance),"money"));
 const actions=node("div","","grid");
 if(!c.archived) actions.append(
 button("+ Qarz",()=>transaction(c,"debt")),
 button("+ To'lov",()=>transaction(c,"payment"),"green")
 );
 if(admin()&&c.archived){
 actions.append(button("Arxivdan qaytarish",()=>changeArchive(c,false),"green"));
 box.append(node("p","Arxivlangan mijoz","muted"));
 }else if(!c.archived){
 if(admin())actions.append(button("Tahrirlash",()=>editCustomer(c),"secondary"));
 const archiveButton=button("Arxivlash",()=>changeArchive(c,true),"secondary");
 archiveButton.disabled=Number(c.balance)!==0;
 actions.append(archiveButton);
 if(archiveButton.disabled)box.append(node("p","Arxivlash uchun qoldiq 0 bo'lishi kerak.","muted"));
 }
 if(admin())actions.append(button("Mijoz hisoboti",()=>customerReport(c.customer_id),"secondary"));
 box.append(actions,node("h3","Operatsiyalar tarixi"));
 const history=node("div","Yuklanmoqda...");
 box.append(history);
 const {data,error}=await db.from("customer_history")
 .select("*").eq("customer_id",id)
 .order("created_at",{ascending:false}).limit(100);
 history.replaceChildren();
 if(error){
 history.textContent=error.message;
 return;
 }
 if(!data.length)history.textContent="Operatsiyalar yo'q.";
 for(const t of data){
 const r=node("div","","customer");
 r.append(node("b",(t.type==="debt"?"Qarz":t.type==="payment"?"To'lov":t.type)+" — "+money(t.amount)),
 node("small",t.branch_name+" | "+new Date(t.created_at).toLocaleString("ru-RU")+(t.type==="payment"?" | "+paymentLabel(t):"")),
 node("p",t.cancelled?"Bekor qilingan":"Cheklar: "+t.receipt_count,"muted"));
 if(!t.cancelled&&!c.archived&&(admin()||t.employee_id===profile.id)){
 r.append(button("Chek biriktirish",()=>receipt(t.transaction_id,id),"small secondary"));
 const cancel=button("Bekor qilish",()=>cancelOperation(t.transaction_id,id),"small secondary");
 cancel.style.color="#b91c1c";
 if(admin()||reportDate(new Date(t.created_at))===reportDate())r.append(cancel);
 }
 if(Number(t.receipt_count)>0)r.append(button("Chekni ko'rish",()=>viewReceipts(t.transaction_id,id),"small secondary"));
 history.append(r);
 }
}
function transaction(c,type){
 const box=modal(type==="debt"?"Qarz yozish":"To'lov olish");
 box.append(node("p",c.full_name));
 const form=document.createElement("form");
 form.innerHTML=`
 <label>Do'kon</label>
 <select name="branch" required></select>
 <label>Summa (so'm)</label>
 <input name="amount" type="number" min="1" step="1" required>
 ${type==="payment"?`<label>To‘lov usuli</label><select name="payment_method" required><option value="">Tanlang</option><option value="cash">Naqd</option><option value="click">CLICK</option></select>`:""}
 <label>Izoh</label>
 <textarea name="note"></textarea>
 ${type==="debt"?`<label>To‘lov muddati (ixtiyoriy)</label><input name="due" type="date">`:""}
 <button class="full">Saqlash</button>`;
 const select=form.elements.branch;
 if(admin()){
 select.append(new Option("Do'konni tanlang",""));
 for(const b of branches)select.append(new Option(b.name,b.id));
 }else{select.append(new Option(profile.branchName,profile.branch_id));select.disabled=true;}

 box.append(form);
 form.onsubmit=async e=>{
 e.preventDefault();
 const f=new FormData(form);
 const amount=Number(f.get("amount"));
 const b=form.querySelector("button");
 b.disabled=true;
 try{
 if(!Number.isSafeInteger(amount)||amount<=0)
 throw new Error("Summani to'g'ri kiriting.");
 await rpc("add_transaction",{
 p_customer_id:c.customer_id,
 p_branch_id:admin()?f.get("branch"):null,
 p_type:type,
 p_amount:amount,
 p_order_id:null,
 p_note:f.get("note")||null,
 p_due_date:f.get("due")||null,
 p_payment_method:type==="payment"?f.get("payment_method"):null
 });
 await load();
 await showCustomer(c.customer_id);
 }catch(e){el("modalMessage").textContent=e.message}
 finally{b.disabled=false}
 };
}
function receipt(transactionId,customerId){
 const box=modal("Chek rasmini biriktirish");
 const form=document.createElement("form");
 form.innerHTML=`
 <input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
 <textarea name="note" placeholder="Izoh"></textarea>
 <button class="full">Rasmni yuklash</button>`;
 box.append(form);
 form.onsubmit=async e=>{
 e.preventDefault();
 const f=new FormData(form);
 const file=f.get("photo");
 const b=form.querySelector("button");
 b.disabled=true;
 try{
 if(!["image/jpeg","image/png","image/webp"].includes(file.type))
 throw new Error("JPG, PNG yoki WEBP rasm tanlang.");
 if(file.size>5*1024*1024)
 throw new Error("Rasm 5 MB dan oshmasin.");
 const path=await rpc("prepare_receipt",{
 p_transaction_id:transactionId,
 p_note:f.get("note")||null
 });
 const {error}=await db.storage.from("receipts")
 .upload(path,file,{contentType:file.type,upsert:false});
 if(error)throw error;
 const ok=await rpc("confirm_receipt",{p_file_path:path});
 if(!ok)throw new Error("Chek tasdiqlanmadi.");
 await showCustomer(customerId);
 }catch(e){el("modalMessage").textContent=e.message}
 finally{b.disabled=false}
 };
}
async function init(){
 const {data,error}=await db.auth.getUser();
 if(!error&&data.user){
 try{await checkUser(data.user)}
 catch(e){errorMessage(e)}
 }
}
async function viewReceipts(transactionId, customerId){
  const box=modal("Biriktirilgan cheklar");

  box.append(button("← Orqaga",
    ()=>showCustomer(customerId),"secondary"));

  try{
    const {data,error}=await db.from("attachments")
      .select("file_path,file_name,note")
      .eq("transaction_id",transactionId)
      .eq("archived",false);

    if(error)throw error;

    if(!data.length){
      box.append(node("p","Cheklar mavjud emas."));
      return;
    }

    for(const a of data){
      const {data:url,error:err}=await db.storage
        .from("receipts")
        .createSignedUrl(a.file_path,300);

      if(err)throw err;

      const img=document.createElement("img");
      img.src=url.signedUrl;
      img.style.width="100%";
      img.style.borderRadius="12px";
      img.style.marginTop="12px";
      box.append(img);

      if(a.note)box.append(node("p",a.note));
    }
  }catch(e){
    el("modalMessage").textContent=e.message;
  }
}

async function cancelOperation(transactionId, customerId){
  const reason=prompt("Bekor qilish sababini yozing:");

  if(!reason || !reason.trim())return;

  if(!confirm("Operatsiyani bekor qilishni tasdiqlaysizmi?"))return;

  try{
    await rpc("cancel_transaction",{
      p_transaction_id:transactionId,
      p_reason:reason.trim()
    });

    alert("Operatsiya bekor qilindi.");
    location.reload();

  }catch(e){
    alert("Xatolik: "+e.message);
  }
}

async function editCustomer(c){
 const box=modal("Mijozni tahrirlash");
 const loading=node("p","Yuklanmoqda...");box.append(loading);
 try{
 const {data,error}=await db.from("customers").select("full_name,phone,note,archived").eq("id",c.customer_id).single();
 if(error)throw error;
 if(data.archived)throw new Error("Mijoz arxivlangan.");
 if(!loading.isConnected||!el("modal").open)return;
 loading.remove();
 const form=document.createElement("form");
 form.innerHTML=`<label>Ism familiya</label><input name="name" required minlength="2"><label>Telefon raqami</label><input name="phone" type="tel"><label>Izoh</label><textarea name="note"></textarea><button class="full">Saqlash</button>`;
 form.elements.name.value=data.full_name;
 form.elements.phone.value=data.phone||"";
 form.elements.note.value=data.note||"";
 box.append(form,button("Orqaga",()=>showCustomer(c.customer_id),"secondary"));
 form.onsubmit=async e=>{
 e.preventDefault();const b=form.querySelector("button");b.disabled=true;
 try{
 const ok=await rpc("update_customer",{p_customer_id:c.customer_id,p_full_name:form.elements.name.value.trim(),p_phone:form.elements.phone.value.trim()||null,p_note:form.elements.note.value.trim()||null});
 if(!ok)throw new Error("Saqlanmadi.");
 await load();await showCustomer(c.customer_id);
 }catch(e){el("modalMessage").textContent=e.message}finally{b.disabled=false}
 };
 }catch(e){loading.textContent=e.message;}
}
async function changeArchive(c,archived){
 if(archived&&Number(c.balance)!==0)return;
 if(!confirm(c.full_name+ (archived?" — arxivlashni tasdiqlaysizmi?":" — arxivdan qaytarilsinmi?")))return;
 const buttons=[...el("modalBody").querySelectorAll("button")];
 const states=buttons.map(b=>b.disabled);buttons.forEach(b=>b.disabled=true);
 try{
 const ok=await rpc("archive_customer",{p_customer_id:c.customer_id,p_archived:archived});
 if(!ok)throw new Error("Holat o'zgarmadi.");
 el("modal").close();await load();
 }catch(e){el("modalMessage").textContent=e.message;buttons.forEach((b,i)=>b.disabled=states[i]);}
}
function paymentLabel(t){return t.type!=="payment"?"":t.payment_method==="cash"?"Naqd":t.payment_method==="click"?"CLICK":"Belgilanmagan";}
function paymentTotals(rows){const totals=[["Naqd",0],["CLICK",0],["Belgilanmagan",0]];for(const t of rows)if(!t.cancelled&&t.type==="payment")totals[t.payment_method==="cash"?0:t.payment_method==="click"?1:2][1]+=Number(t.amount);return totals;}
function reportDay(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).filter(x=>x.type!=='literal').reduce((a,x)=>(a[x.type]=x.value,a),{});}
function reportDate(d=new Date()){const p=reportDay(d);return `${p.year}-${p.month}-${p.day}`;}
function shiftDay(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
async function showReports(){
 if(!admin())return;
 const box=modal('Hisobotlar'); const root=node('div','');box.append(root);el('modal').classList.add('reportWide');
 root.innerHTML=`<form><label>Davr</label><select name="period"><option value="today">Bugun</option><option value="yesterday">Kecha</option><option value="week">Shu hafta</option><option value="month" selected>Shu oy</option><option value="custom">Ixtiyoriy</option></select><div class="grid"><label>Boshlanish<input type="date" name="start" required></label><label>Tugash<input type="date" name="end" required></label></div><label>Do'kon</label><select name="branch"><option value="">Barcha do'konlar</option></select><label>Xodim / admin</label><select name="employee"><option value="">Barcha xodimlar va adminlar</option></select><label>Operatsiya</label><select name="type"><option value="">Barchasi</option><option value="debt">Qarz</option><option value="payment">To'lov</option></select><button class="full" disabled>Hisobotni ko'rish</button></form>`;
 const f=root.querySelector('form'), e=f.elements, run=f.querySelector('button'), result=node('div','');root.append(result);

 try{

 function preset(){const t=reportDate(), all=e.period.value==='all';e.start.parentElement.parentElement.hidden=all;e.start.required=e.end.required=!all;if(all||e.period.value==='custom')return;let s=t,z=t;switch(e.period.value){case 'yesterday':s=z=shiftDay(t,-1);break;case 'week':s=shiftDay(t,-((new Date(t+'T00:00:00Z').getUTCDay()+6)%7));break;case 'month':s=t.slice(0,7)+'-01';break;case 'lastmonth':z=shiftDay(t.slice(0,7)+'-01',-1);s=z.slice(0,7)+'-01';break;}e.start.value=s;e.end.value=z;}
 let version=0;function invalidate(){version++;root.replaceChildren();run.disabled=false;}
 e.period.onchange=()=>{preset();invalidate();};e.start.onchange=e.end.onchange=()=>{e.period.value='custom';invalidate();};preset();
 form.onsubmit=async ev=>{ev.preventDefault();const token=++version;run.disabled=true;root.textContent='Yuklanmoqda...';const all=e.period.value==='all',start=e.start.value,end=e.end.value,day=all?'Barcha davr':start===end?start:start+' — '+end;
 try{
 if(!all&&(!start||!end||start>end))throw Error('Sanalar noto‘g‘ri.');
 const rows=[];
 for(let i=0;;i+=500){let q=db.from('transactions').select('id,customer_id,branch_id,type,amount,created_at,cancelled,payment_method').eq('employee_id',who).order('created_at').order('id').range(i,i+499);if(!all)q=q.gte('created_at',start+'T00:00:00+05:00').lt('created_at',shiftDay(end,1)+'T00:00:00+05:00');const {data,error}=await q;if(error)throw error;rows.push(...data);if(data.length<500)break;}
 const [cs,bs]=await Promise.all([read('customers','id,full_name'),read('branches','id,name')]);
 if(token!==version||!root.isConnected||!el('modal').open||profile?.id!==who)return;
 const cm=new Map(cs.map(c=>[c.id,c.full_name])),bm=new Map(bs.map(b=>[b.id,b.name]));
 let debt=0,paid=0,cancelled=0;for(const t of rows){if(t.cancelled)cancelled++;else if(t.type==='debt')debt+=Number(t.amount);else if(t.type==='payment')paid+=Number(t.amount);}
 const summary=[['Davr',day],['Xodim',employee],['Joriy do‘kon',branch],['Qarz',debt],['To‘lov',paid],...paymentTotals(rows),['Sof o‘zgarish',debt-paid],['Faol operatsiyalar',rows.length-cancelled],['Bekor qilingan',cancelled]];
 const details=[['Vaqt (Toshkent)','Mijoz','Do‘kon','Tur','Summa','To‘lov usuli','Holat'],...rows.map(t=>[new Date(t.created_at).toLocaleString('ru-RU',{timeZone:'Asia/Tashkent'}),cm.get(t.customer_id)||t.customer_id,bm.get(t.branch_id)||t.branch_id,t.type==='debt'?'Qarz':'To‘lov',Number(t.amount),paymentLabel(t),t.cancelled?'Bekor qilingan':'Faol'])];
 root.replaceChildren();const printable=node('div','');printable.append(node('h2','UDUM QARZ — Shaxsiy hisobot'),node('p',day+' | '+employee+' | '+branch+' | Toshkent vaqti'));const grid=node('div','','grid');for(const [k,v] of summary.slice(3)){const st=node('div','','stat');st.append(node('small',k),node('strong',k.includes('operatsiyalar')||k==='Bekor qilingan'?String(v):money(v)));grid.append(st);}printable.append(grid);const wrap=node('div','','reportScroll'),tab=node('table','','reportTable');details.forEach((r,i)=>{const tr=node('tr','');r.forEach(v=>tr.append(node(i?'td':'th',String(v))));tab.append(tr);});wrap.append(tab);printable.append(wrap);root.append(printable);
 root.append(button('Excel (.xlsx)',()=>{try{const w=XLSX.utils.book_new();for(const [n,a] of [['Jami',summary],['Operatsiyalar',details]])XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet(a),n);XLSX.writeFile(w,'UDUM-shaxsiy-'+(all?'barcha-davr':start+'-'+end)+'.xlsx');}catch(e){alert(e.message);}},'green full'),button('PDF / Chop etish',()=>{const p=window.open('','_blank');if(!p)return alert('Yangi oynaga ruxsat bering.');const st=p.document.createElement('style');st.textContent='body{font:12px Arial}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px}.stat strong{display:block}';p.document.head.append(st);p.document.body.append(p.document.importNode(printable,true));p.print();},'full'));
 }catch(e){if(token===version)root.textContent=e.message||String(e);}finally{if(token===version)run.disabled=false;}
 };form.requestSubmit();
}
async function employees(){
 if(!admin())return;
 const box=modal("Xodimlar");
 if(admin() && profile.id==="b60757dd-ec80-429b-bd38-18d7be5de542") box.append(button("+ Yangi xodim",newEmployee,"green full"));
 try{
 const list=await read("profiles","id,full_name,role,branch_id,active");
 for(const p of list){
 const row=node("div","","customer");
 row.append(node("b",p.full_name),node("p",(p.role==="admin"?"Administrator":branches.find(b=>b.id===p.branch_id)?.name||"Do'kon biriktirilmagan")+" · "+(p.active?"Faol":"Faol emas"),"muted"));
 if(p.role==="employee")row.append(button("Tahrirlash",()=>editEmployee(p),"secondary small"));
 if(p.role==="employee" && profile.id==="b60757dd-ec80-429b-bd38-18d7be5de542")row.append(button("Parolni almashtirish",()=>resetEmployeePassword(p),"secondary small"));
 if(p.role==="employee" && p.active && profile.id==="b60757dd-ec80-429b-bd38-18d7be5de542"){const remove=button("Faolsizlantirish",async()=>{if(!confirm(p.full_name+" hisobini faolsizlantirasizmi? Amallar tarixi saqlanadi."))return;try{await rpc("manage_employee",{p_id:p.id,p_full_name:p.full_name,p_branch_id:p.branch_id,p_active:false});await employees();}catch(e){el("modalMessage").textContent=e.message;}},"secondary small");remove.style.color="#b91c1c";row.append(remove);}
 box.append(row);
 }
 }catch(e){el("modalMessage").textContent=e.message}
}
function editEmployee(p){
 if(!admin())return;
 const box=modal("Xodimni tahrirlash"),f=document.createElement("form");
 f.innerHTML='<label>Ism familiya</label><input name="fullname" required maxlength="150"><label>Do\'kon</label><select name="branch" required></select><label>Holati</label><select name="active"><option value="true">Faol</option><option value="false">Faol emas</option></select><button class="full">Saqlash</button>';
 f.elements.fullname.value=p.full_name;
 f.elements.branch.append(new Option("Tanlang",""));
 for(const b of branches)f.elements.branch.append(new Option(b.name,b.id));
 f.elements.branch.value=p.branch_id||"";
 f.elements.active.value=String(p.active);
 box.append(f,button("Orqaga",employees,"secondary"));
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector("button");b.disabled=true;try{await rpc("manage_employee",{p_id:p.id,p_full_name:f.elements.fullname.value,p_branch_id:f.elements.branch.value,p_active:f.elements.active.value==="true"});await employees();}catch(e){el("modalMessage").textContent=e.message;}finally{b.disabled=false;}};
}
function resetEmployeePassword(p){
 if(!admin()||profile.id!=="b60757dd-ec80-429b-bd38-18d7be5de542"||p.role!=="employee")return;
 const box=modal("Parolni almashtirish"),f=document.createElement("form");
 box.append(node("p",p.full_name,"muted"));
 f.innerHTML='<label>Yangi parol (kamida 6 belgi)</label><input name="password" type="password" minlength="6" maxlength="72" autocomplete="new-password" required><label>Yangi parolni takrorlang</label><input name="repeat" type="password" minlength="6" maxlength="72" autocomplete="new-password" required><button class="full green">Saqlash</button>';
 box.append(f,button("Orqaga",employees,"secondary"));
 f.onsubmit=async e=>{
 e.preventDefault();const btn=f.querySelector("button");el("modalMessage").textContent="";
 if(f.elements.password.value!==f.elements.repeat.value){el("modalMessage").textContent="Parollar bir xil emas";return;}
 btn.disabled=true;
 try{
 const {data,error}=await db.functions.invoke("reset-employee-password",{body:{employee_id:p.id,password:f.elements.password.value}});
 if(error){let message=error.message;try{const j=await error.context.json();message=j.error||message;}catch{}throw Error(message);}
 if(!data?.ok)throw Error(data?.error||"Parol almashtirilmadi");
 f.reset();await employees();alert(data.audit_saved===false?"Parol almashtirildi, ammo tarix yozilmadi.": "Parol muvaffaqiyatli almashtirildi.");
 }catch(e){el("modalMessage").textContent=e.message;}finally{btn.disabled=false;}
 };
}
function newEmployee(){
 if(!admin() || profile.id!=="b60757dd-ec80-429b-bd38-18d7be5de542")return;
 const box=modal("Yangi xodim"),f=document.createElement("form");
 f.innerHTML=`<label>Ism familiya</label><input name="fullname" required maxlength="150"><label>Elektron pochta (login)</label><input name="email" type="email" required autocomplete="off"><label>Parol (kamida 6 belgi)</label><input name="password" type="password" minlength="6" maxlength="72" required autocomplete="new-password"><label>Do'kon</label><select name="branch" required></select><button class="full">Xodim yaratish</button>`;
 f.elements.branch.append(new Option("Tanlang",""));
 for(const b of branches)f.elements.branch.append(new Option(b.name,b.id));
 box.append(f,button("Orqaga",employees,"secondary"));
 f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector("button");b.disabled=true;el("modalMessage").textContent="";try{
 const {data,error}=await db.functions.invoke("create-employee",{body:{full_name:f.elements.fullname.value,email:f.elements.email.value,password:f.elements.password.value,branch_id:f.elements.branch.value}});
 if(error){let message=error.message;try{const j=await error.context.json();message=j.error||message;}catch{}throw Error(message);}
 if(!data?.ok)throw Error(data?.error||"Xodim yaratilmadi");
 f.elements.password.value="";await employees();alert("Xodim yaratildi.");
 }catch(e){el("modalMessage").textContent=e.message;}finally{b.disabled=false;}};
}
el("showEmployees").onclick=employees;

init();
</script>
